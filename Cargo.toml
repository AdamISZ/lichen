[workspace]
resolver = "2"
members = ["crates/ledger", "crates/l2", "crates/sequencer", "crates/chain", "crates/proto", "crates/hub", "crates/wallet", "crates/demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bitcoin = { version = "0.32", features = ["serde"] }
bitcoincore-rpc = "0.19"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
esplora-client = { version = "0.13", default-features = false, features = ["blocking-https-rustls"] }
# the withdrawal statement's data and check: the ledger's notes, tree and
# roots are exactly what the proof checks (ln-gap, path for now)
lngap-r0-core = { path = "../ln-gap/crates/apps/sessions/r0/core" }
lichen-ledger = { path = "crates/ledger" }
lichen-l2 = { path = "crates/l2" }
lichen-chain = { path = "crates/chain" }
lichen-proto = { path = "crates/proto" }
lichen-hub = { path = "crates/hub" }
lichen-wallet = { path = "crates/wallet" }
# the contract and the dispute (ln-gap)
lngap-sessions = { path = "../ln-gap/crates/apps/sessions" }
lngap-zk = { path = "../ln-gap/crates/apps/zk" }
lngap-ladder = { path = "../ln-gap/crates/apps/ladder" }
lngap-channel = { path = "../ln-gap/crates/channel" }
lngap-btc = { path = "../ln-gap/crates/btc" }
lngap-lamport = { path = "../ln-gap/crates/lamport" }
emulator = { git = "https://github.com/FairgateLabs/BitVMX-CPU", rev = "299009c65e635327025ee13ffe1e1f1671bd0615" }
lichen-sequencer = { path = "crates/sequencer" }

# Dependencies (ln-gap's crates among them) optimised even in debug builds:
# the emulator, the pre-signing and the curve arithmetic are too slow at
# opt-level 0 for a hub to answer within a move's window in the tests. A
# profile applies only from the top-level workspace, so lichen repeats
# ln-gap's. Our own crates stay at debug for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

# BitVMX-CPU as ln-gap builds it: the `lngap` branch of a public fork
# (upstream 299009c, bug fixes, the opt-in jump list). A [patch] applies
# only from the top-level workspace, so lichen repeats ln-gap's.
[patch."https://github.com/FairgateLabs/BitVMX-CPU"]
emulator = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }
bitvmx-cpu-definitions = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }
bitcoin-script-riscv = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }
