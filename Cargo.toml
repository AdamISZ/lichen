[workspace]
resolver = "2"
members = ["crates/ledger", "crates/sequencer", "crates/wallet"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
# the withdrawal statement's data and check: the ledger's notes, tree and
# roots are exactly what the proof checks (ln-gap, path for now)
lngap-r0-core = { path = "../ln-gap/crates/apps/sessions/r0/core" }
lichen-ledger = { path = "crates/ledger" }
lichen-sequencer = { path = "crates/sequencer" }
