[workspace]
resolver = "2"
exclude = ["r0"]
members = ["crates/contract", "crates/notes", "crates/ledger", "crates/shielded", "crates/validity", "crates/withdraw", "crates/l2", "crates/sequencer", "crates/chain", "crates/proto", "crates/hub", "crates/wallet", "crates/babe"]

[workspace.package]
# The fork point, kept: the guests' ELFs (their image ids) change with their
# crates' versions. The grants release's version is lichen_proto::VERSION.
version = "0.4.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bitcoin = { version = "0.32", features = ["serde"] }
bitcoincore-rpc = "0.19"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
esplora-client = { version = "0.13", default-features = false, features = ["blocking-https-rustls"] }
lichen-ledger = { path = "crates/ledger" }
lichen-shielded = { path = "crates/shielded" }
lichen-validity = { path = "crates/validity" }
lichen-withdraw = { path = "crates/withdraw" }
lichen-l2 = { path = "crates/l2" }
lichen-notes = { path = "crates/notes" }
lichen-chain = { path = "crates/chain" }
lichen-proto = { path = "crates/proto" }
lichen-hub = { path = "crates/hub" }
lichen-wallet = { path = "crates/wallet" }
lichen-babe = { path = "crates/babe" }
lichen-contract = { path = "crates/contract" }
# the Bitcoin layer (lichenbtc-org/lichen-btc)
lichen-btc = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "2a02a55e3f05a8d956544b68495522dc33f57966" }
lichen-wots = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "2a02a55e3f05a8d956544b68495522dc33f57966" }
lichen-risc0 = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "2a02a55e3f05a8d956544b68495522dc33f57966" }
lichen-sequencer = { path = "crates/sequencer" }

# Dependencies (lichen-btc's crates among them) optimised even in debug
# builds: the pre-signing and the curve arithmetic are too slow at
# opt-level 0 for a hub to answer within a move's window in the tests.
# Our own crates stay at debug for fast rebuilds, but for the contract's
# pre-signing and BABE's garbling.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.lichen-contract]
opt-level = 2

# BABE's garbling, the exception: half a million gates and field
# elements, half a minute a test at opt-level 0, seconds at 2.
[profile.dev.package.lichen-babe]
opt-level = 2
