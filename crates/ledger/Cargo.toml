[package]
name = "lichen-ledger"
description = "The L2 ledger: transparent notes, transfers, mints, signed roots"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
getrandom.workspace = true
hex.workspace = true
k256.workspace = true
serde.workspace = true
sha2.workspace = true
lngap-r0-core.workspace = true
lichen-shielded.workspace = true
lichen-validity.workspace = true
# the sequencer's: RISC Zero's verifier, for receipts of the spend guest
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"], optional = true }
bincode = { version = "1.3", optional = true }

[features]
risc0 = ["dep:risc0-zkvm", "dep:bincode"]

[dev-dependencies]
serde_json.workspace = true
