[package]
name = "lichen-withdraw"
description = "The withdrawal statement, with validity: a return under a root that ends a proven valid history"
# self-contained (not inherited from the workspace): the withdrawal guest
# builds it alone, as the chain guest builds lichen-validity
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
lichen-validity = { path = "../validity" }
sha2 = { version = "0.10", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["schnorr"] }
# the hub's Winternitz signature on `b` (the fixed statement): HASH160, as
# Script checks it
ripemd = { version = "0.1", default-features = false }

[dev-dependencies]
# the hub's signature checked against ln-gap's own (what Script checks)
lngap-lamport.workspace = true
