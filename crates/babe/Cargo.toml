[package]
name = "lichen-babe"
description = "BABE's garbling: the witness encryption for Groth16 and the garbled circuit for r·π1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# RISC Zero's verifying key and claim, checked natively
lichen-risc0.workspace = true
# the reveal on chain: adaptor signatures, scripts, keys
lichen-btc.workspace = true
# the graph, on lichen's contract
lichen-contract.workspace = true
lichen-wots.workspace = true
# what the hub's statement reads of the exit on Bitcoin (exit)
lichen-statement.workspace = true
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = { version = "0.5", default-features = false, features = ["std"] }
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
blake3 = "1"
# the input secrets' sharing, over secp256k1 (the adaptor signatures')
k256.workspace = true
rand_chacha = "0.3"
rand_core = "0.6"
sha2.workspace = true
serde.workspace = true
# byte strings as hex in JSON (hexbytes)
hex.workspace = true

[dev-dependencies]
serde_json.workspace = true
bitcoincore-rpc.workspace = true
