[package]
name = "lichen-babe"
description = "BABE's garbling: the witness encryption for Groth16 and the garbled circuit for r·π1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# RISC Zero's verifying key and claim, as ln-gap checks them natively
lngap-zk.workspace = true
# the reveal on chain: adaptor signatures, scripts, keys
lngap-btc.workspace = true
# the graph, on ln-gap's skeleton
lngap-channel.workspace = true
lngap-lamport.workspace = true
lngap-sessions.workspace = true
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = { version = "0.5", default-features = false, features = ["std"] }
ark-serialize = "0.5"
ark-std = "0.5"
blake3 = "1"
# the input secrets' sharing, over secp256k1 (the adaptor signatures')
k256.workspace = true
rand_chacha = "0.3"
rand_core = "0.6"
sha2.workspace = true

[dev-dependencies]
bitcoincore-rpc.workspace = true
hex.workspace = true
ark-relations = "0.5"
ark-snark = "0.5"
