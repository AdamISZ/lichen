# A lichen hub and sequencer with their node, for NETWORK (deploy/.env).
#   deploy/build.sh && docker compose -f deploy/docker-compose.yml up -d
# On regtest add `--profile regtest` for a miner. Data: deploy/data/<network>/.
name: lichen-${NETWORK:?set NETWORK in deploy/.env}

x-lichen: &lichen
  image: lichen:latest
  environment:
    NETWORK: ${NETWORK}
    STATEMENT: ${STATEMENT:-groth16}
    RESERVE_PPM: ${RESERVE_PPM:-20000}
    MAX_BITS: ${MAX_BITS:-24}
    DURATION: ${DURATION:-}
    SEAL_EVERY: ${SEAL_EVERY:-5}
  restart: unless-stopped

services:
  bitcoind:
    image: lichen-bitcoind:${NETWORK}
    command: ["bitcoind"]
    volumes:
      - ./data/${NETWORK}/bitcoind:/data
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 5s
      retries: 60

  miner:
    image: lichen-bitcoind:${NETWORK}
    profiles: ["regtest"]
    command: ["miner", "${MINE_EVERY:-5}"]
    environment:
      RPC_HOST: bitcoind
    volumes:
      - ./data/${NETWORK}/bitcoind:/data
    depends_on:
      bitcoind: { condition: service_healthy }
    restart: unless-stopped

  hub-key:
    <<: *lichen
    command: ["hub-key"]
    volumes:
      - ./data/${NETWORK}/hub:/hub
      - ./data/${NETWORK}/shared:/shared
    restart: "no"

  sequencer:
    <<: *lichen
    command: ["sequencer"]
    volumes:
      - ./data/${NETWORK}/sequencer:/seq
      - ./data/${NETWORK}/shared:/shared:ro
    ports:
      - "${SEQUENCER_PORT:-18300}:18300"
    depends_on:
      hub-key: { condition: service_completed_successfully }

  hub:
    <<: *lichen
    command: ["hub"]
    volumes:
      - ./data/${NETWORK}/hub:/hub
      - ./data/${NETWORK}/bitcoind:/bitcoind:ro
    ports:
      - "${HUB_PORT:-18310}:18310"
    depends_on:
      bitcoind: { condition: service_healthy }
      sequencer: { condition: service_started }
