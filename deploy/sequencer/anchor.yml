# The sequencer anchoring its history on Bitcoin (docs/RUN_A_SEQUENCER.md,
# "Anchoring"), through the node of a hub on this same machine
# (deploy/hub's compose project for the same NETWORK), its wallet
# ANCHOR_WALLET (made on first use) paying the anchors:
#   docker compose -f deploy/sequencer/docker-compose.yml -f deploy/sequencer/anchor.yml up -d
# A new ledger gets its genesis seal on first start, so fund the wallet
# first (deploy/hub/hub.sh cli -rpcwallet=sequencer getnewaddress).
services:
  sequencer:
    command:
      - --listen=0.0.0.0:18300
      - --ledger=/seq/ledger.json
      - --key=/seq/sequencer.key
      - --issuer=${ISSUER:?set ISSUER in deploy/sequencer/.env (the hub's L2 key)}
      - --seal-every=${SEAL_EVERY:-5}
      - --network=${NETWORK}
      - --anchor-rpc=http://bitcoind:8332
      # the node's cookie under its data directory: signet/.cookie on
      # Mutinynet and signet, regtest/.cookie, testnet4/.cookie
      - --anchor-cookie=/bitcoind/${ANCHOR_COOKIE:-signet/.cookie}
      - --anchor-wallet=${ANCHOR_WALLET:-sequencer}
      - --anchor-confirmations=${ANCHOR_CONFIRMATIONS:-1}
      - --anchor-feerate=${ANCHOR_FEERATE:-2}
    volumes:
      - ./data/${NETWORK}:/seq
      - ../hub/data/${NETWORK}/bitcoind:/bitcoind:ro
    networks: [default, hub]

networks:
  hub:
    external: true
    name: lichen-hub-${NETWORK}_default
