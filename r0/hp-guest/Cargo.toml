# The hub's statement guest, the grants L2's (agent notes:
# docs/GRANTS_PLAN.md): proves "the claim Alice signed is owed at most the
# b_corr she countersigned" (crates/withdraw, `accounts::check`). BABE
# checks its Groth16 wrap, with the roles swapped: the hub proves, Alice
# garbles. A workspace of its own, built as the other guests
# (r0/build-guest.sh hp).
[package]
name = "hp"
version = "0.1.0"
edition = "2021"
license = "MIT"
# the toolchain of risczero/risc0-guest-builder:r0.1.97.0
rust-version = "1.97"

[workspace]
resolver = "3"

[dependencies]
lichen-withdraw = { path = "../../crates/withdraw" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }

# RISC Zero's accelerated crypto: the Merkle paths and the headers are
# SHA-256; the notes', claims' and spends' signatures BIP340, and the
# unlocks' points secp256k1
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
