[package]
name = "lichen-r0"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# the in-process prover (on a Mac: in Docker, r0/Dockerfile, or natively
# with Xcode and its Metal toolchain, which risc0-sys compiles kernels with;
# it proves on the CPU either way, RISC Zero having no Metal prover now)
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["prove", "std"] }
risc0-binfmt = "=3.0.6"
risc0-zkos-v1compat = "=2.2.3"
lichen-shielded = { path = "../../crates/shielded" }
lichen-validity = { path = "../../crates/validity" }
lichen-withdraw = { path = "../../crates/withdraw" }
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# proving on an NVIDIA GPU (the CUDA toolkit's nvcc to build; Linux):
# cargo build --release --features cuda. The Groth16 wrap then runs on
# the GPU too, natively, without Docker, given RISC Zero's component
# (rzup install risc0-groth16); on a rented 4090 it failed, though
# (docs/HUB_PROVES_PLAN.md, step 7)
cuda = ["risc0-zkvm/cuda"]
