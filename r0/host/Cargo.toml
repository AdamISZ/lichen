[package]
name = "lichen-r0"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# the in-process prover (on a Mac: in Docker, r0/Dockerfile; RISC Zero's
# kernels for macOS need Xcode's Metal compiler)
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["prove", "std"] }
risc0-binfmt = "=3.0.5"
risc0-zkos-v1compat = "=2.2.3"
lichen-shielded = { path = "../../crates/shielded" }
lichen-validity = { path = "../../crates/validity" }
lichen-withdraw = { path = "../../crates/withdraw" }
# the counter's Groth16 check, natively, as the BABE guest makes it
lichen-groth16 = { path = "../../crates/groth16" }
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
