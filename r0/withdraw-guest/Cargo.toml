# The withdrawal guest (docs/SHIELDED_PLAN.md, phase 2, step 4): proves
# the withdrawal statement of crates/withdraw, ln-gap's with a chain
# receipt at its root. A workspace of its own, built with RISC Zero's guest
# toolchain in its pinned builder image (r0/build-guest.sh withdraw).
[package]
name = "withdraw"
version = "0.1.0"
edition = "2021"
license = "MIT"
# the toolchain of risczero/risc0-guest-builder:r0.1.88.0
rust-version = "1.88"

[workspace]
resolver = "3"

[dependencies]
lichen-withdraw = { path = "../../crates/withdraw" }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }

# RISC Zero's accelerated crypto: the path is SHA-256, the sequencer's
# signature on the root BIP340
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
