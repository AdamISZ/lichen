# The BABE withdrawal guest (docs/BABE_GADGET_PLAN.md, step 1): proves the
# fixed statement of crates/withdraw (`fixed`), the withdrawal guest's with
# `b` in the witness under the hub's signature, its journal the same for
# every amount; and with the exit (docs/EXIT_PLAN.md), its three branches
# (`fixed::check_exit`), a counter checked as a Groth16 receipt of the
# counter guest. A workspace of its own, built as the withdrawal guest
# (r0/build-guest.sh babe).
[package]
name = "babe"
version = "0.1.0"
edition = "2021"
license = "MIT"
# the toolchain of risczero/risc0-guest-builder:r0.1.88.0
rust-version = "1.88"

[workspace]
resolver = "3"

[dependencies]
lichen-withdraw = { path = "../../crates/withdraw" }
lichen-groth16 = { path = "../../crates/groth16" }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }

# RISC Zero's accelerated crypto: the path and the hub's signature on `b`
# are SHA-256, the sequencer's signature on the root BIP340, the counter's
# check BN254 (about 47M cycles with this fork, docs/EXIT_PLAN.md step 0)
[patch.crates-io]
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
