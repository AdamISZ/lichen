mily="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">running: posts nothing</text><rect x="50.0" y="264" width="40.2" height="22" rx="4" fill="#ffedd5" stroke="#c2410c"/><line x1="456.3255813953488" y1="288" x2="456.3255813953488" y2="304" stroke="#c2410c" stroke-width="1.5"/><text x="462.3255813953488" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="start">started 12:46:40; conceded 12:46:43</text><line x1="795.6744186046511" y1="288" x2="795.6744186046511" y2="304" stroke="#c2410c" stroke-width="1.5"/><text x="789.6744186046511" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="end">settled 13:27:57</text><text x="50" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">The hub was back 4 blocks into its 80-block window. Had the claim been false, it had 76 blocks left to post move 2.</text><text x="50" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">The claim was true, so the hub posted nothing, and the dispute ran exactly as if it were still away: escalation to sweep, 67 minutes.</text></svg>
