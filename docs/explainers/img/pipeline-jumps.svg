<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="314" viewBox="0 0 1060 314"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="313" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">A disputed read: the hub's path through the jump list, from the agreed step back to the write</text><line x1="60" y1="150" x2="1000" y2="150" stroke="#d1d5db" stroke-width="4"/><path d="M 960.8333333333334 154 C 960.8333333333334 172, 941.25 172, 943.25 157" fill="none" stroke="#c2410c" stroke-width="1.4" marker-end="url(#ah)"/><path d="M 941.25 146 C 941.25 105.5, 843.3333333333334 105.5, 846.3333333333334 143" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#ah)"/><path d="M 843.3333333333334 146 C 843.3333333333334 92.0, 686.6666666666666 92.0, 689.6666666666666 143" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#ah)"/><path d="M 686.6666666666666 154 C 686.6666666666666 172, 667.0833333333334 172, 669.0833333333334 157" fill="none" stroke="#c2410c" stroke-width="1.4" marker-end="url(#ah)"/><path d="M 667.0833333333334 146 C 667.0833333333334 60.5, 373.3333333333333 60.5, 376.3333333333333 143" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#ah)"/><path d="M 373.3333333333333 146 C 373.3333333333333 110.0, 295.0 110.0, 298.0 143" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#ah)"/><path d="M 295.0 154 C 295.0 172, 275.41666666666663 172, 277.41666666666663 157" fill="none" stroke="#c2410c" stroke-width="1.4" marker-end="url(#ah)"/><path d="M 275.41666666666663 146 C 275.41666666666663 114.5, 216.66666666666666 114.5, 219.66666666666666 143" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#ah)"/><circle cx="216.66666666666666" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="275.41666666666663" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="295.0" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="373.3333333333333" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="667.0833333333334" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="686.6666666666666" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="843.3333333333334" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="941.25" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="960.8333333333334" cy="150" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><circle cx="960.8333333333334" cy="150" r="7" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="940.8333333333334" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="end">step t: both agree on its hash</text><circle cx="216.66666666666666" cy="150" r="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="206.66666666666666" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="start">the write Alice names for her read</text><text x="569.1666666666667" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle">← hops back to the previous step, or to the step's long jump</text><text x="24" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Each step's hash covers the previous step's hash and its long jump's: h(i) = BLAKE3(h(i−1) ‖ h(jump(i)) ‖ write_i ‖ i).</text><text x="24" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">So from h(t) a short path reaches any earlier step: at most 86 hops over 2^29 steps, about 52 on average.</text><text x="24" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">The hub posts the path; Alice may challenge any hop she finds false; the verdict compares the write found with her read.</text></svg>
