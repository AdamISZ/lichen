ont-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Fees, grey: the hub's 1,000 for the liquidity, her 1,000 share of the funding, the sweep's 500.</text><text x="120" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Of her 99,000 tokens, 49,984 came back as b; 49,016 are still on the L2 (Bob's 30,000, her 19,016), with no contract behind them.</text><text x="120" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Her Bitcoin: 151,000 out, 69,984 + 29,500 = 99,484 back.</text><text x="120" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">The hub: in 131,971 (V_max − D, r_H, its 1,000 fee share), back 179,987: +48,016, the 49,016 tokens out less the fold's fee.</text></svg>
