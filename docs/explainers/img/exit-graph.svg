<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="599" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">On chain: BABE's dispute, with the exit's claim in request and the counter in respond</text><rect x="24" y="70" width="170" height="74" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="109.0" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">contract output</text><text x="109.0" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">V_max + r_A + r_H</text><text x="109.0" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">pre-signed at opening</text><rect x="228" y="62" width="210" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="333.0" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">request</text><text x="333.0" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice signs b and E, and posts</text><text x="333.0" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the claim: its notes, h_S, SR_S,</text><text x="333.0" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the owners' signatures</text><line x1="194" y1="107" x2="226" y2="107" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="478" y="54" width="250" height="64" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="603.0" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">respond, plain</text><text x="603.0" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub signs b, and E under e_plain</text><rect x="478" y="128" width="250" height="76" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="603.0" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">respond, countering</text><text x="603.0" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub signs b, E under e_counter,</text><text x="603.0" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">and K, its counter's proof itself</text><text x="603" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle" font-style="italic">two leaves, one transaction: either way, assert follows</text><line x1="438" y1="100" x2="476" y2="86" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="438" y1="112" x2="476" y2="160" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="768" y="86" width="268" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="902.0" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">assert</text><text x="902.0" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice's proof π of her statement,</text><text x="902.0" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">before T_A; the hub challenges a</text><text x="902.0" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">false one (BABE's challenge)</text><line x1="728" y1="86" x2="766" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="728" y1="166" x2="766" y2="140" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="228" y="262" width="210" height="74" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="333.0" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">request_timeout</text><text x="333.0" y="303" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">after w_H, no response:</text><text x="333.0" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice is paid b</text><line x1="333" y1="154" x2="333" y2="260" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4 3"/><rect x="478" y="262" width="250" height="74" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="603.0" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">respond_timeout</text><text x="603.0" y="303" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">from T_A, no assertion:</text><text x="603.0" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub takes the contract</text><line x1="603" y1="230" x2="603" y2="260" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4 3"/><rect x="768" y="262" width="268" height="74" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="902.0" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">success, or the answer</text><text x="902.0" y="303" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice is paid b (in bits)</text><text x="902.0" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">and the reserves</text><line x1="902" y1="178" x2="902" y2="260" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="370" width="1012" height="200" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="40" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Alice's statement: one guest, one journal; she wins on any of three branches</text><text x="52" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• return: the hub signed b, and a return of b to the contract is anchored (a refused withdrawal; E doesn't matter)</text><text x="52" y="445" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• claim: the hub signed b and E in the plain leaf, and her claim holds: her notes unspent at S, request posting it</text><text x="52" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• failed counter: the hub signed E and K in the counter leaf, and K isn't a counter for her D ‖ E</text><text x="40" y="487" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start"></text><text x="40" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">A true counter leaves her no branch: she can't assert, and from T_A the contract is the hub's.</text><text x="40" y="529" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">A false one pays her through the third, and anyone can prove it: it needs no secret of hers.</text><text x="40" y="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">The key that signed E says which leaf ran; script compares the hub's b and E with hers, digit by digit.</text></svg>
