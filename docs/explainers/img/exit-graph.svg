="#0f766e" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="890.0" cy="398.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><line x1="896.0" y1="398.0" x2="936.0" y2="398.0" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="943.0" cy="398.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><line x1="949.0" y1="398.0" x2="989.0" y2="398.0" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="996.0" cy="398.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="890.0" y="417.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle" font-style="italic">challenge–response moves, not shown</text><line x1="684" y1="107" x2="742" y2="107" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ah)"/><text x="713" y="99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle">counters</text><path d="M 602 144 C 602 280, 700 380, 742 380" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah)"/><text x="608" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="start">no counter</text><rect x="744" y="200" width="140" height="88" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="814.0" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">counter holds</text><text x="814.0" y="241" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">she spent since S:</text><text x="814.0" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the operator takes all</text><rect x="896" y="200" width="140" height="88" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="966.0" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">counter fails</text><text x="966.0" y="241" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the cheat loses:</text><text x="966.0" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice b + r_A + r_H,</text><text x="966.0" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub V_max − b</text><line x1="814" y1="178" x2="814" y2="198" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="966" y1="178" x2="966" y2="198" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="744" y="470" width="140" height="88" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="814.0" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">proof holds</text><text x="814.0" y="511" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">(or a timeout):</text><text x="814.0" y="527" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice b + r_A + r_H,</text><text x="814.0" y="543" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub V_max − b</text><rect x="896" y="470" width="140" height="88" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="966.0" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">proof fails</text><text x="966.0" y="511" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">a false claim:</text><text x="966.0" y="527" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the operator takes all</text><line x1="814" y1="448" x2="814" y2="468" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="966" y1="448" x2="966" y2="468" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="220" width="196" height="74" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="122.0" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">default</text><text x="122.0" y="261" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">after T_close, only if</text><text x="122.0" y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">no escalation has confirmed</text><line x1="122" y1="144" x2="122" y2="218" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4 3"/><rect x="24" y="330" width="196" height="74" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="122.0" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">fold</text><text x="122.0" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">both sign, at any time:</text><text x="122.0" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice b + r_A</text><path d="M 30 144 C 8 200, 8 300, 30 328" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4 3"/><path d="M 370 160 C 370 290, 260 367, 222 367" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4 3"/><text x="470" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle" font-style="italic">the operator may still fold</text><text x="470" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle" font-style="italic">after checking her proof itself</text><text x="24" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Exactly one game is played, under any play:</text><text x="36" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">• a true counter wins its game, and Alice loses;</text><text x="36" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">• a false counter loses its game, and Alice is paid at once;</text><text x="36" y="526" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">• with no counter, Alice's game, which the operator folds if her claim is true.</text><text x="24" y="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Each game is one instance of the gadget, pre-signed at opening;</text><text x="24" y="577" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">its moves, windows and timeouts are the gadget's own.</text></svg>
