<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="599" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">On chain: one escalation, then the gadget in one of two places</text><rect x="24" y="70" width="196" height="74" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="122.0" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">contract output</text><text x="122.0" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">V_max + r_A + r_H</text><text x="122.0" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">2-of-2, pre-signed at opening</text><rect x="260" y="70" width="220" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="370.0" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">escalate</text><text x="370.0" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice: her proof, b ‖ c ‖ D ‖ E,</text><text x="370.0" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">and her nullifiers, signed;</text><text x="370.0" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">confirms by T_close</text><rect x="520" y="70" width="164" height="74" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="5 4"/><text x="602.0" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">counter window W_c</text><text x="602.0" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">≈ 18 blocks on mainnet</text><text x="602.0" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the operator may counter</text><line x1="220" y1="107" x2="258" y2="107" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="480" y1="107" x2="518" y2="107" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="744" y="56" width="292" height="122" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="758" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">the counter game</text><text x="758" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the operator proves its counter; Alice challenges</text><rect x="758" y="108" width="264" height="56" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="784.0" cy="128.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><line x1="790.0" y1="128.0" x2="