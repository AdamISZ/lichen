<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="590" viewBox="0 0 1060 590"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="589" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">What the hub has after a restart, what it reads from the chain, and what it decides</text><rect x="24" y="60" width="300" height="118" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="38" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">on its disk: the contract</text><text x="38" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the terms, both sides' keys</text><text x="38" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">every pre-signed transaction, both signatures</text><text x="38" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the 18 checked words' agreed values</text><text x="38" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">(nothing about the dispute)</text><rect x="24" y="200" width="300" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="38" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">on chain: escalate's witness</text><text x="38" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Alice's one-time signatures on</text><text x="38" y="259" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">11 input words (b, the memo, the image id…)</text><text x="38" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">and move 1 (the trace's claim)</text><rect x="24" y="316" width="300" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="38" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">on chain: inputs' witness</text><text x="38" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the other 40 input words:</text><text x="38" y="375" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the Groth16 proof, the deployment id</text><rect x="390" y="220" width="250" height="84" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.6"/><text x="404" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">the claim's input</text><text x="404" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">51 words, 204 bytes: what the</text><text x="404" y="279" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">verifier program would run on</text><path d="M 324 250 L 388 258" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 324 356 L 388 284" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="700" y="70" width="336" height="84" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="714" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">1. the 18 checked words</text><text x="714" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">all equal to the agreed values?</text><text x="714" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#6b7280" text-anchor="start" font-style="italic">→ no: take the contract at once (a check leaf)</text><rect x="700" y="190" width="336" height="84" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="714" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">2. the proof, checked natively</text><text x="714" y="231" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">lngap-zk's Groth16 verifier, milliseconds</text><text x="714" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#6b7280" text-anchor="start" font-style="italic">→ rejected: play the search, move by move</text><rect x="700" y="310" width="336" height="62" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="714" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">3. accepted: concede</text><text x="714" y="351" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">post nothing; Alice's timeout will pay her</text><rect x="700" y="420" width="336" height="62" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="714" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">4. watch the ladder output</text><text x="714" y="461" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">spent by her timeout: the contract is settled</text><path d="M 640 262 C 670 262, 670 110, 698 110" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="868" y1="154" x2="868" y2="188" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="868" y1="274" x2="868" y2="308" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="868" y1="372" x2="868" y2="418" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="878" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">yes</text><text x="878" y="295" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">accepted</text><text x="24" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Nothing of the dispute needs to be kept: the claim is on chain, signed by Alice, and the moves (had there been any) are too.</text><text x="24" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">The native check stands in for the 477,810,565 steps of the verifier program, which the hub would emulate only to dispute.</text><text x="24" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">Here: started 12:46:40, conceded 12:46:43.</text></svg>
