<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="469" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Alice's contract: the same $100,100 throughout. Only who gets it at the end changes.</text><text x="24" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">1. Alice opens</text><text x="24" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Alice $100, the hub $100,000</text><rect x="250.0" y="70" width="3.0" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="253.0" y="70" width="779.2" height="46" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><text x="642.6103896103896" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">the hub's $100,000: back to the hub if Alice leaves now</text><text x="250" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">Alice holds 100 tokens</text><text x="24" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">2. The hub prints</text><text x="24" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">100,000 tokens, from nothing</text><rect x="250.0" y="162" width="3.0" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="253.0" y="162" width="779.2" height="46" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><text x="642.6103896103896" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">unchanged: nothing new is locked, nothing is unlocked</text><text x="250" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">the hub holds 100,000 tokens</text><text x="24" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">3. The hub buys the car</text><text x="24" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">paying Alice 100,000 tokens</text><rect x="250.0" y="254" width="780.0" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="640.0" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Alice's $100,100: what she can take out now</text><text x="250" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">Alice holds 100,100 tokens</text><text x="24" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">4. Alice withdraws</text><text x="24" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">she hands back 100,100 tokens</text><rect x="250.0" y="346" width="780.0" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="640.0" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">$100,100 to Alice, in bitcoin</text><text x="250" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">the hub's $100,000 is gone: it paid for the car</text><text x="252" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="start">Alice's $100</text><rect x="250" y="446" width="14" height="14" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="270" y="458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Alice's if the contract closed now</text><rect x="550" y="446" width="14" height="14" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="570" y="458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">the hub's if the contract closed now</text></svg>
