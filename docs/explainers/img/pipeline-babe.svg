<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="469" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">What a challenge hands Alice, and how a valid proof turns it into msg</text><text x="24" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">at opening, per contract</text><rect x="24" y="76" width="300" height="96" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="174.0" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">the hub's 78 instances</text><text x="174.0" y="117" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">each: a garbled circuit computing r·A</text><text x="174.0" y="133" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">from A's bits (r its own secret), and the</text><text x="174.0" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">ciphertext: r·δ, and msg masked by r·T</text><rect x="24" y="196" width="300" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="174.0" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">Alice's cut-and-choose</text><text x="174.0" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">she opens 68 and checks them;</text><text x="174.0" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">she keeps 10 (about 240 MiB)</text><line x1="174" y1="174" x2="174" y2="192" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="384" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">in the dispute, on chain</text><rect x="384" y="76" width="300" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="534.0" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">assert (Alice)</text><text x="534.0" y="117" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">A's 508 bits in 254 2-bit digits,</text><text x="534.0" y="133" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">one Lamport preimage each</text><rect x="384" y="196" width="300" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="534.0" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">challenge_assert (the hub)</text><text x="534.0" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">one secret per digit, for the value</text><text x="534.0" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice signed: her adaptor pre-signatures</text><line x1="534" y1="156" x2="534" y2="192" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="744" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">then, on Alice's machine</text><rect x="744" y="76" width="292" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="890.0" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the labels of A</text><text x="890.0" y="117" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">each kept instance's, interpolated</text><text x="890.0" y="133" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">from the secrets and the opened shares</text><rect x="744" y="196" width="292" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="890.0" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">evaluate</text><text x="890.0" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">each kept circuit on A's labels:</text><text x="890.0" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">r·A, under its own r</text><path d="M 686 235 L 712 235 L 712 115 L 740 115" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="890" y1="156" x2="890" y2="192" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="306" width="1012" height="104" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="530" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Groth16 checks  e(A, B) + e(C, δ) = T.  Multiply through by r:</text><text x="530" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">e(r·A, B) + e(C, r·δ) = r·T</text><text x="530" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice has r·A from the circuit, B and C from her proof, and r·δ from the ciphertext: r·T unmasks msg,</text><text x="530" y="397" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">but only if the proof is valid for the contract's statement. A false proof opens no instance.</text><line x1="890" y1="276" x2="890" y2="302" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="24" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">The secrets reveal only the labels of the A that Alice signed, so she can evaluate the circuit on that A and no other;</text><text x="24" y="458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">r stays inside the circuit. A kept instance a dishonest hub garbled wrong would be caught, with overwhelming odds, among the opened ones.</text></svg>
