<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="469" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">The search: Alice posts 7 hashes, the hub picks one of 8 intervals, ten times</text><text x="24" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">round 1</text><text x="24" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">moves 1 and 2</text><line x1="190" y1="86" x2="1010" y2="86" stroke="#d1d5db" stroke-width="6"/><circle cx="292.5" cy="86" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="395.0" cy="86" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="497.5" cy="86" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="600.0" cy="86" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><rect x="702.5" y="74" width="102.5" height="24" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><circle cx="702.5" cy="86" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="805.0" cy="86" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="907.5" cy="86" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="190" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">step 0</text><text x="1010" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">2^29</text><path d="M 702.5 104 L 190 140" fill="none" stroke="#c2410c" stroke-width="1" stroke-dasharray="3 3"/><path d="M 805.0 104 L 1010 140" fill="none" stroke="#c2410c" stroke-width="1" stroke-dasharray="3 3"/><text x="24" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">round 2</text><text x="24" y="177" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">moves 3 and 4</text><line x1="190" y1="162" x2="1010" y2="162" stroke="#d1d5db" stroke-width="6"/><circle cx="292.5" cy="162" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><rect x="395.0" y="150" width="102.5" height="24" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><circle cx="395.0" cy="162" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="497.5" cy="162" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="600.0" cy="162" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="702.5" cy="162" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="805.0" cy="162" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="907.5" cy="162" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="190" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle"></text><text x="1010" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle"></text><path d="M 395.0 180 L 190 216" fill="none" stroke="#c2410c" stroke-width="1" stroke-dasharray="3 3"/><path d="M 497.5 180 L 1010 216" fill="none" stroke="#c2410c" stroke-width="1" stroke-dasharray="3 3"/><text x="24" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">…</text><text x="600.0" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">… each round narrows the interval 8 times …</text><text x="24" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">round 10</text><text x="24" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">moves 19 and 20</text><line x1="190" y1="272" x2="1010" y2="272" stroke="#d1d5db" stroke-width="6"/><circle cx="292.5" cy="272" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="395.0" cy="272" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="497.5" cy="272" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="600.0" cy="272" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="702.5" cy="272" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><rect x="805.0" y="260" width="102.5" height="24" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><circle cx="805.0" cy="272" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="907.5" cy="272" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="190" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle"></text><text x="1010" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle"></text><line x1="856.25" y1="290" x2="856.25" y2="318" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="610" y="322" width="420" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="820" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">move 21: Alice's record of step t + 1</text><text x="820" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">its instruction, its reads, its write, the hashes either side</text><circle cx="30" cy="402" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="44" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">a hash Alice posts: the state after that step</text><rect x="24" y="420" width="14" height="14" rx="3" fill="#ffedd5" stroke="#c2410c"/><text x="44" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the interval the hub disputes: it agrees with her hash at the left end, not at the right</text><text x="24" y="458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">8^10 = 2^30 covers the verifier's 2^29 steps. They end agreeing on the hash after step t and disagreeing after step t + 1.</text></svg>
