family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 6</text><rect x="472" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="500.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">8</text><text x="500.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 7</text><rect x="552" y="76" width="56" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="580.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">5</text><text x="580.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">check 0</text><rect x="616" y="76" width="56" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="644.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">5</text><text x="644.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">check 1</text><text x="276" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">8 message digits, big-endian: 0x000088B8 = 35,000</text><text x="612" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">0x55 = 85 = Σ (15 − d)</text><text x="24" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">The low four nibbles in binary: an output for each bit from 9 up (bits below 9 get none)</text><rect x="24" y="218" width="50" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="49.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="49.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 15</text><rect x="82" y="218" width="50" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="107.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="107.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 14</text><rect x="140" y="218" width="50" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="165.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="165.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 13</text><rect x="198" y="218" width="50" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="223.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="223.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 12</text><rect x="270" y="218" width="50" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="295.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="295.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 11</text><rect x="328" y="218" width="50" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="353.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="353.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 10</text><rect x="386" y="218" width="50" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="411.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="411.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 9</text><rect x="444" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="469.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">0</text><text x="469.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 8</text><rect x="516" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="541.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">1</text><text x="541.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 7</text><rect x="574" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="599.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">0</text><text x="599.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 6</text><rect x="632" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="657.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">1</text><text x="657.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 5</text><rect x="690" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="715.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">1</text><text x="715.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 4</text><rect x="762" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="787.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">1</text><text x="787.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 3</text><rect x="820" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="845.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">0</text><text x="845.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 2</text><rect x="878" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="903.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">0</text><text x="903.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 1</text><rect x="936" y="218" width="50" height="36" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="961.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">0</text><text x="961.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 0</text><text x="136" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">nibble 4 = 8 = 1000</text><text x="382" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">nibble 5 = 8 = 1000</text><text x="628" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">nibble 6 = B = 1011</text><text x="874" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">nibble 7 = 8 = 1000</text><text x="24" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Each bit leaf checks the whole signature, picks its nibble, and tests one bit of it:</text><rect x="24" y="356" width="500" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="40" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#111827" text-anchor="start">alice_bit_11</text><text x="40" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bit 11 = bit 3 of nibble 5 (bits 8–11)</text><text x="40" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">nibble 5 = 8</text><text x="40" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">8 ≥ 8?  yes: the bit is 1</text><text x="40" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">→ the 2,048 output is Alice's (after δ = 40 blocks)</text><text x="40" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">spent by the sweep: 1,122 B of witness, 787 B of it script</text><rect x="536" y="356" width="500" height="150" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><text x="552" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#111827" text-anchor="start">hub_bit_9</text><text x="552" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bit 9 = bit 1 of nibble 5</text><text x="552" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">nibble 5 = 8; reduce mod 4: 8 − 8 = 0</text><text x="552" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">0 ≥ 2?  no: the bit is 0, and OP_NOT makes that a pass</text><text x="552" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="start">→ the 512 output is the hub's (no wait)</text><text x="552" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="start">not spent yet: the hub has no sweep for its bits</text><text x="24" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Nobody else can change the reading: a Winternitz digit's hash can only be hashed further (to a larger digit), and the</text><text x="24" y="554" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">checksum digits would then have to get smaller, which needs a preimage. Two different values of b signed by Alice herself are</text><text x="24" y="572" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">an equivocation: the hub's equiv_b leaf on every output takes them, which is why her leaves wait δ.</text></svg>
