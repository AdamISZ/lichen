<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="599" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Erin's exit: reading b = 126 units off the chain, and deciding two outputs</text><text x="24" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Her request (834b657f…) carries her one-time signature on b: ten digits, each with its hash; each bit leaf checks it again.</text><rect x="24" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="52.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="52.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 0</text><rect x="88" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="116.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="116.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 1</text><rect x="152" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="180.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="180.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 2</text><rect x="216" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="244.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="244.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 3</text><rect x="280" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="308.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="308.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 4</text><rect x="344" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="372.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="372.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 5</text><rect x="408" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="436.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">7</text><text x="436.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 6</text><rect x="472" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="500.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">E</text><text x="500.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 7</text><rect x="552" y="76" width="56" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="580.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">6</text><text x="580.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">check 0</text><rect x="616" y="76" width="56" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="644.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">3</text><text x="644.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">check 1</text><text x="276" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">8 message digits, big-endian: 0x0000007E = 126 units</text><text x="612" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">0x63 = 99 = Σ (15 − d)</text><text x="24" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">The contract's 8 bits, in its last two nibbles: an output of 781 · 2^i for each</text><rect x="24" y="218" width="106" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="77.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="77.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 7: 99,968</text><rect x="140" y="218" width="106" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="193.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="193.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 6: 49,984</text><rect x="256" y="218" width="106" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="309.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="309.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 5: 24,992</text><rect x="372" y="218" width="106" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="425.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="425.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 4: 12,496</text><rect x="516" y="218" width="106" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="569.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="569.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 3: 6,248</text><rect x="632" y="218" width="106" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="685.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="685.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 2: 3,124</text><rect x="748" y="218" width="106" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="801.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="801.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 1: 1,562</text><rect x="864" y="218" width="106" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="917.0" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="917.0" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">bit 0: 781</text><text x="252" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">nibble 6 = 7 = 0111</text><text x="744" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">nibble 7 = E = 1110</text><text x="24" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Each bit leaf checks the whole signature, picks its nibble, and tests one bit of it:</text><rect x="24" y="356" width="500" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="40" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#111827" text-anchor="start">alice_bit_6</text><text x="40" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bit 6 = bit 2 of nibble 6 (bits 4–7)</text><text x="40" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">nibble 6 = 7; reduce mod 8: 7</text><text x="40" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">7 ≥ 4?  yes: the bit is 1</text><text x="40" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">→ the 49,984 output is Erin's (after δ = 40 blocks)</text><text x="40" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">swept by her sweep: 1,127 B of witness, 794 B of it script</text><rect x="536" y="356" width="500" height="150" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><text x="552" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#111827" text-anchor="start">hub_bit_7</text><text x="552" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bit 7 = bit 3 of nibble 6</text><text x="552" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">nibble 6 = 7; reduce mod 16: 7</text><text x="552" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">7 ≥ 8?  no: the bit is 0, and OP_NOT makes that a pass</text><text x="552" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="start">→ the 99,968 output is the hub's (no wait)</text><text x="552" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="start">collected by the hub the next block (69fa312f…)</text><text x="24" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Nobody else can change the reading: a Winternitz digit's hash can only be hashed further (to a larger digit), and the</text><text x="24" y="554" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">checksum digits would then have to get smaller, which needs a preimage. Two different values of b signed by Erin herself are</text><text x="24" y="572" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">an equivocation: the hub's equiv_b leaf on every output takes them, which is why her leaves wait δ.</text></svg>
