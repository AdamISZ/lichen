<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="599" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Test B: reading b = 35,000 off the chain, and deciding two outputs</text><text x="24" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">The sweep's input for bit 11 (21ee8b9f…, input 0) carries Alice's one-time signature on b: ten digits, each with its hash.</text><rect x="24" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="52.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="52.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 0</text><rect x="88" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="116.0" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="116.0" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">nibble 1</text><rect x="152" y="76" width="56" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="180.0" y="102" font-family="ui-monospace,SFMono-Regu