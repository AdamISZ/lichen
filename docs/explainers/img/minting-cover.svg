<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="299" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">What a token is worth depends on who holds it: the holder's contract, not the token</text><text x="24" y="83" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Alice</text><text x="24" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">contract: up to $100,100</text><rect x="250" y="64" width="487.7" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="493.841349156777" y="89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">covered: $100,100</text><line x1="737.682698313554" y1="58" x2="737.682698313554" y2="110" stroke="#7c3aed" stroke-width="2"/><text x="24" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Alice, past her cap</text><text x="24" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">paid 60,000 more</text><rect x="250" y="130" width="487.7" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="493.841349156777" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">covered: $100,100</text><rect x="737.7" y="130" width="292.3" height="40" fill="#ffffff" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/><text x="883.841349156777" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4b5563" text-anchor="middle">$60,000: only the hub's word</text><line x1="737.682698313554" y1="124" x2="737.682698313554" y2="176" stroke="#7c3aed" stroke-width="2"/><text x="24" y="215" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Bob</text><text x="24" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">no contract</text><rect x="250.0" y="196" width="26.0" height="40" fill="#ffffff" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/><text x="284.0" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4b5563" text-anchor="start">$5,000: only the hub's word</text><text x="737.682698313554" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">her cap</text><text x="24" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Printing more tokens never shrinks anyone's covered part; it can only add tokens that nobody's contract covers.</text></svg>
