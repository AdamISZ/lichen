<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" viewBox="0 0 1060 400"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="399" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">From an execution to 128 bytes: segments, recursion, and the shrink-wrap</text><text x="24" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">a long guest: segments of about a million cycles</text><rect x="24" y="76" width="70" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="59" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">segment 1</text><rect x="24" y="130" width="70" height="26" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.1"/><text x="59" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">lift</text><line x1="59" y1="107" x2="59" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="104" y="76" width="70" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3"/><text x="139" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">segment 2</text><rect x="104" y="130" width="70" height="26" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 3"/><text x="139" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">lift</text><line x1="139" y1="107" x2="139" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="184" y="76" width="70" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3"/><text x="219" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">segment 3</text><rect x="184" y="130" width="70" height="26" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 3"/><text x="219" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">lift</text><line x1="219" y1="107" x2="219" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="264" y="76" width="70" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3"/><text x="299" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">segment 4</text><rect x="264" y="130" width="70" height="26" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 3"/><text x="299" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">lift</text><line x1="299" y1="107" x2="299" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="64.0" y="182" width="70" height="26" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 3"/><text x="99.0" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">join</text><line x1="59" y1="157" x2="89.0" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="139" y1="157" x2="109.0" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="224.0" y="182" width="70" height="26" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 3"/><text x="259.0" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">join</text><line x1="219" y1="157" x2="249.0" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="299" y1="157" x2="269.0" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="149" y="232" width="70" height="26" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="4 3"/><text x="184" y="249" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">join</text><line x1="99" y1="209" x2="174" y2="230" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="269" y1="209" x2="194" y2="230" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="288" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#4b5563" text-anchor="middle">resolve</text><text x="24" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="start">Ours is one segment (about 393k cycles): one lift, no joins;</text><text x="24" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="start">then a resolve takes in the sequencer's chain receipt.</text><text x="24" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Dashed: what a longer guest would add.</text><rect x="380" y="214" width="180" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="470.0" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">succinct receipt</text><text x="470.0" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">a STARK: Poseidon2</text><text x="470.0" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">over BabyBear (31 bits)</text><text x="470.0" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">about 220 kB</text><rect x="610" y="214" width="180" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="700.0" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">identity_p254</text><text x="700.0" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the same claim, re-proved</text><text x="700.0" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">with Poseidon over</text><text x="700.0" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">BN254's field</text><rect x="840" y="214" width="180" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="930.0" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">Groth16 receipt</text><text x="930.0" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">3 BN254 points:</text><text x="930.0" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">256 bytes, 128 compressed</text><text x="930.0" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">gnark, x86 only</text><path d="M 219 245 C 290 245, 300 260, 376 260" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="562" y1="260.0" x2="606" y2="260.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="792" y1="260.0" x2="836" y2="260.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="585.0" y="252.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#4b5563" text-anchor="middle">re-prove</text><text x="815.0" y="252.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">wrap</text><text x="380" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Every receipt says the same thing:</text><text x="380" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">“the program with image id X ran and output journal J”.</text><text x="380" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Each step changes only how it is proved, so that the next step can take it:</text><text x="380" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">any length → one STARK → a STARK a BN254 circuit can check → Groth16.</text><text x="380" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Measured: the STARK in 75 s on a Mac (Docker, 8 cores), 361 s on a 4-vCPU x86 server;</text><text x="380" y="357" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the wrap in 258 s on that server, with about 8 GB of memory.</text></svg>
