<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="639" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Two proofs, by two parties, from different data; both RISC Zero guests, wrapped in Groth16</text><text x="24" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">Alice's claim</text><text x="24" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">proved after the hub responds plainly, from what she holds</text><rect x="24" y="98" width="480" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="38" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from her exit kit, for an anchored state S:</text><text x="50" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• the chain receipt, the root SR_S at height h_S</text><text x="50" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• each note's path in T_S, its nullifier absent from N_S</text><text x="38" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from Bitcoin: S's anchor, and request in its block,</text><text x="62" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">each with W of work on it</text><text x="38" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from her wallet: the notes' openings and her keys</text><line x1="264.0" y1="248" x2="264.0" y2="270" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="272" width="480" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="264.0" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the BABE guest, its claim branch</text><text x="264.0" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the notes in S and unspent there, b ≤ Σ,</text><text x="264.0" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">request carries this claim, signed</text><line x1="264.0" y1="340" x2="264.0" y2="362" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="364" width="480" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="264.0" y="388" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">c ‖ D ‖ H(pk_H ‖ O_D)</text><text x="264.0" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the contract's journal, fixed at its opening</text><line x1="264.0" y1="420" x2="264.0" y2="442" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="556" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="start">The hub's counter</text><text x="556" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">proved before it responds, only if one exists</text><rect x="556" y="98" width="480" height="150" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><text x="570" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from Alice's request, on chain:</text><text x="582" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• her E, and the claim it hashes: notes, h_S, SR_S</text><text x="570" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from its own ledger (it is the sequencer), either:</text><text x="582" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• one of the notes spent at a later anchored S′,</text><text x="594" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">anchored by request's block (not her own return)</text><text x="582" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• or her signed claim of it through another contract</text><line x1="796.0" y1="248" x2="796.0" y2="270" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="556" y="272" width="480" height="68" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.6"/><text x="796.0" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the counter guest</text><text x="796.0" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">S′ in S's history and the spend in it,</text><text x="796.0" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">or the other claim's signature</text><line x1="796.0" y1="340" x2="796.0" y2="362" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="556" y="364" width="480" height="56" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.4"/><text x="796.0" y="388" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">D ‖ E</text><text x="796.0" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the same E as Alice's claim, so the same contract</text><line x1="796.0" y1="420" x2="796.0" y2="442" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="444" width="480" height="58" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="264.0" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">π: Alice's proof, asserted</text><text x="264.0" y="485" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">checked on Bitcoin by BABE: the hub challenges a false one</text><rect x="556" y="444" width="480" height="58" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="796.0" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">K: 128 bytes, signed in respond</text><text x="796.0" y="485" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">checked inside Alice's statement: a false K pays her</text><path d="M 796 502 C 796 560, 520 540, 470 580" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 264 502 L 264 578" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah)"/><rect x="120" y="580" width="520" height="46" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="380" y="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Alice's statement: return, or claim, or K is no counter</text><text x="380" y="617" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">one guest, one journal; BABE checks the proof of it</text></svg>
