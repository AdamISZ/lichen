<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="659" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Two proofs, by two parties, from different data; the same pipeline and the same gadget</text><text x="24" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">Alice's exit proof</text><text x="24" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">made before she escalates, from what she holds</text><rect x="24" y="98" width="480" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="38" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from her exit kit, for an anchored state S:</text><text x="50" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• the chain receipt at height h_S, root SR_S</text><text x="50" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• each note's path in the tree T_S</text><text x="50" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• each nullifier's non-membership in N_S</text><text x="38" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from Bitcoin: headers with W of work on S's anchor</text><text x="38" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from her wallet: the notes' openings, and nk</text><line x1="264.0" y1="248" x2="264.0" y2="270" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="272" width="480" height="68" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="264.0" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the exit guest</text><text x="264.0" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">derives the nullifiers from the notes and nk,</text><text x="264.0" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">checks every path and non-membership, b ≤ Σ</text><line x1="264.0" y1="340" x2="264.0" y2="362" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="364" width="480" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="264.0" y="388" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">b ‖ c ‖ D ‖ E</text><text x="264.0" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">E = H(c ‖ h_S ‖ SR_S ‖ nullifiers)</text><line x1="264.0" y1="420" x2="264.0" y2="442" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="24" y="444" width="480" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="264.0" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">STARK, then Groth16: about 256 bytes</text><text x="556" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="start">The operator's counter proof</text><text x="556" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">made only if a later spend exists, within W_c</text><rect x="556" y="98" width="480" height="150" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><text x="570" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from Alice's escalation, on chain:</text><text x="582" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• her E, and what it hashes: c, h_S, SR_S, nullifiers</text><text x="570" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">from its own ledger (it is the sequencer):</text><text x="582" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• the chain receipt at a later anchored S′, 10 deep</text><text x="582" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">• one of her nullifiers, inserted at h_S &lt; h ≤ h_S′,</text><text x="594" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">not by contract c's own return or exit record</text><line x1="796.0" y1="248" x2="796.0" y2="270" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="556" y="272" width="480" height="68" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.6"/><text x="796.0" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the counter guest</text><text x="796.0" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">checks that S′'s history passes through S,</text><text x="796.0" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">and the insertion, in it</text><line x1="796.0" y1="340" x2="796.0" y2="362" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="556" y="364" width="480" height="56" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.4"/><text x="796.0" y="388" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">D ‖ E ‖ ok</text><text x="796.0" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the same E as Alice's claim, so the same contract c</text><line x1="796.0" y1="420" x2="796.0" y2="442" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="556" y="444" width="480" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="796.0" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">STARK, then Groth16: about 256 bytes</text><path d="M 264 490 C 264 515, 420 512, 440 540" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 796 490 C 796 515, 640 512, 620 540" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ah)"/><rect x="200" y="542" width="660" height="100" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="214" y="564" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">the verification gadget</text><text x="214" y="582" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">checks a Groth16 proof and its journal on Bitcoin; reads chosen journal words into Script</text><rect x="214" y="594" width="632" height="34" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="240.0" cy="603.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><line x1="246.0" y1="603.0" x2="378.0" y2="603.0" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="385.0" cy="603.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><line x1="391.0" y1="603.0" x2="523.0" y2="603.0" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="530.0" cy="603.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><line x1="536.0" y1="603.0" x2="668.0" y2="603.0" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="675.0" cy="603.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><line x1="681.0" y1="603.0" x2="813.0" y2="603.0" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="820.0" cy="603.0" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="530.0" y="622.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle" font-style="italic">challenge–response moves, not shown</text></svg>
