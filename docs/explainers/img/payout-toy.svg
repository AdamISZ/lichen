<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="559" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">A toy payout: a unit of 1,000 sats, 4 bits, a cap of 15 units; Alice's b = 9 units</text><text x="24" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">b, binary</text><rect x="140" y="70" width="80" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="180.0" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="180.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">8,000 sats</text><rect x="230" y="70" width="80" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="270.0" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="270.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">4,000 sats</text><rect x="320" y="70" width="80" height="36" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="360.0" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="360.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">2,000 sats</text><rect x="410" y="70" width="80" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="450.0" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="450.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">1,000 sats</text><text x="510" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">= 9 units: every bit has an output of u·2^i</text><text x="510" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">(none is under 512 sats, so none is dust)</text><rect x="24" y="236" width="150" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="99" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">the contract</text><text x="99" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">15,000 + 30,000</text><text x="99" y="296" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">= 45,000</text><line x1="174" y1="271" x2="218" y2="271" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="220" y="216" width="150" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="295" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">the payout</text><text x="295" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">pre-signed at opening,</text><text x="295" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">before b is known;</text><text x="295" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">used when Alice</text><text x="295" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">wins the exit</text><rect x="420" y="196" width="360" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="434" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">1,000</text><text x="504" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bit 0 of b is 1</text><text x="766" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="end">Alice's, after δ</text><path d="M 370 271 C 395 271, 395 212, 418 212" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#ah)"/><rect x="420" y="236" width="360" height="32" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="434" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">2,000</text><text x="504" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bit 1 of b is 0</text><text x="766" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="end">the hub's</text><path d="M 370 271 C 395 271, 395 252, 418 252" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#ah)"/><rect x="420" y="276" width="360" height="32" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="434" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">4,000</text><text x="504" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bit 2 of b is 0</text><text x="766" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="end">the hub's</text><path d="M 370 271 C 395 271, 395 292, 418 292" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#ah)"/><rect x="420" y="316" width="360" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="434" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">8,000</text><text x="504" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bit 3 of b is 1</text><text x="766" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="end">Alice's, after δ</text><path d="M 370 271 C 395 271, 395 332, 418 332" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#ah)"/><rect x="420" y="356" width="360" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="434" y="377" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">30,000</text><text x="504" y="377" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">both reserves</text><text x="766" y="377" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="end">Alice's, after δ</text><path d="M 370 271 C 395 271, 395 372, 418 372" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#ah)"/><text x="420" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">Each bit output can go either way; Alice's signed b decides which.</text><rect x="812" y="196" width="224" height="232" rx="8" fill="#fafafa" stroke="#d1d5db" stroke-width="1.2"/><text x="828" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">Alice</text><text x="828" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">8,000 + 1,000 = 9,000</text><text x="828" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">+ reserves 30,000</text><text x="828" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">= 39,000</text><text x="828" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="start">The hub</text><text x="828" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">4,000 + 2,000</text><text x="828" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">= 6,000 = 15,000 − 9,000</text><text x="828" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">together: 45,000,</text><text x="828" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">the whole contract</text><text x="24" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Every bit output (here bit 3's) has the same three leaves:</text><rect x="24" y="490" width="328" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="36" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">alice_bit_3</text><text x="36" y="529" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Alice, after δ, if bit 3 of her signed b is 1</text><rect x="364" y="490" width="328" height="50" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="376" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">hub_bit_3</text><text x="376" y="529" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the hub, at once, if it is 0</text><rect x="704" y="490" width="328" height="50" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="716" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">equiv_b_3</text><text x="716" y="529" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the hub, at once, if she signed two values of b</text></svg>
