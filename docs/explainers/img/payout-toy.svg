" font-weight="400" fill="#111827" text-anchor="start">8,192 + 2,048 + 1,023</text><text x="828" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">= 11,263 = 16,383 − 5,120</text><text x="828" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">together: 46,383,</text><text x="828" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">the whole contract</text><text x="24" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Every bit output (here bit 12's) has the same three leaves:</text><rect x="24" y="490" width="328" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="36" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">alice_bit_12</text><text x="36" y="529" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Alice, after δ, if bit 12 of her signed b is 1</text><rect x="364" y="490" width="328" height="50" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="376" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">hub_bit_12</text><text x="376" y="529" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">the hub, at once, if it is 0</text><rect x="704" y="490" 