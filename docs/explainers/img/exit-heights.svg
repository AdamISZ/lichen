oe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">an anchor: a Bitcoin transaction spending the last one's seal</text><text x="500" y="458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">a spend needs the note's keys; an exit record, her signature on a claim</text></svg>
