" font-weight="400" fill="#4b5563" text-anchor="middle">20,000</text><rect x="294.4" y="150" width="557.2" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="573.0128211926149" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">r_H less the floors, to Alice</text><text x="573.0128211926149" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">175,153</text><rect x="851.6" y="150" width="68.5" height="40" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="885.9008239922796" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">floors</text><text x="885.9008239922796" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">21,543</text><rect x="920.2" y="150" width="2.1" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><rect x="922.3" y="150" width="97.7" height="40" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="971.1347126631812" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">hub: V_max − b</text><text x="971.1347126631812" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">30,719</text><text x="921.2195509931387" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">anchors 660 (Alice's)</text><rect x="640" y="22" width="14" height="14" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="660" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Alice's</text><rect x="760" y="22" width="14" height="14" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="780" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">the hub's</text><rect x="880" y="22" width="14" height="14" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="900" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">fees</text><text x="120" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">The contract funds no fees of its own except the links' floors (1 sat/vB each), and they come out of the loser's reserve.</text><text x="120" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Alice's other costs came from her fee budget, a separate 20,000 output: 160 (split) + 2,000 (the timeout's fee coin),</text><text x="120" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">and the sweep's 1,200 came out of what it swept.</text></svg>
