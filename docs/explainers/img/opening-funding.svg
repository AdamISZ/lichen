ize="11.5" font-weight="400" fill="#4b5563" text-anchor="start">her key: fee coins for an exit's terminals</text><path d="M 440 156 C 465 156, 465 194, 488 194" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#ah)"/><rect x="490" y="244" width="300" height="60" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><text x="506" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">the hub's change: 1,387,871</text><text x="506" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">back to its wallet</text><path d="M 440 156 C 465 156, 465 274, 488 274" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#ah)"/><text x="24" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Who put what into the contract's 250,971</text><rect x="24" y="354" width="403.2338397663475" height="40" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="225.61691988317375" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">D: Alice's deposit</text><text x="225.61691988317375" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">100,000</text><rect x="427.2338397663475" y="354" width="80.6467679532695" height="40" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="467.5572237429823" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">r_A</text><text x="467.5572237429823" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">20,000</text><rect x="507.880607719617" y="354" width="399.82651382032185" height="40" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="707.7938646297779" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">V_max − D: the liquidity</text><text x="707.7938646297779" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">99,155</text><rect x="907.7071215399388" y="354" width="128.29287846006113" height="40" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="971.8535607699694" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">r_H</text><text x="971.8535607699694" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">31,816</text><text x="24" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Alice: 100,000 + 20,000, plus 1,000 of fee and the 30,000 budget = her 151,000.</text><text x="24" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">The hub: 99,155 + 31,816, plus 1,000 of fee = 131,971 out of its coin; its change is the rest.</text></svg>
