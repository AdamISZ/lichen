amily="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">20,000</text><rect x="202.867478993676" y="354" width="127.12111732080554" height="40" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="266.42803765407876" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">V_max − D</text><text x="266.42803765407876" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">35,535</text><rect x="329.9885963144815" y="354" width="706.0114036855184" height="40" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="682.9942981572408" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">r_H: the hub's reserve, the floors of the deepest dispute</text><text x="682.9942981572408" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">197,356</text><text x="24" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Alice: 30,000 + 20,000, plus 1,000 of fee and the 20,000 budget = her 71,000.</text><text x="24" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">The hub: 35,535 + 197,356, plus 1,000 of fee = 233,891 out of its coin; its change is the rest.</text></svg>
