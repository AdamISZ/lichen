<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="318" viewBox="0 0 1060 318"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="317" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">The dispute in blocks (30 s apart on Mutinynet), and the windows that set the pace</text><line x1="50" y1="170" x2="1010" y2="170" stroke="#4b5563" stroke-width="1.5"/><line x1="74.87046632124353" y1="166" x2="74.87046632124353" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="124.61139896373057" y1="166" x2="124.61139896373057" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="174.3523316062176" y1="166" x2="174.3523316062176" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="224.09326424870466" y1="166" x2="224.09326424870466" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="273.8341968911917" y1="166" x2="273.8341968911917" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="323.57512953367876" y1="166" x2="323.57512953367876" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="373.3160621761658" y1="166" x2="373.3160621761658" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="423.05699481865287" y1="166" x2="423.05699481865287" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="472.7979274611399" y1="166" x2="472.7979274611399" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="522.5388601036269" y1="166" x2="522.5388601036269" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="572.279792746114" y1="166" x2="572.279792746114" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="622.020725388601" y1="166" x2="622.020725388601" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="671.7616580310881" y1="166" x2="671.7616580310881" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="721.5025906735751" y1="166" x2="721.5025906735751" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="771.2435233160621" y1="166" x2="771.2435233160621" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="820.9844559585492" y1="166" x2="820.9844559585492" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="870.7253886010362" y1="166" x2="870.7253886010362" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="920.4663212435233" y1="166" x2="920.4663212435233" y2="174" stroke="#4b5563" stroke-width="1.5"/><line x1="970.2072538860103" y1="166" x2="970.2072538860103" y2="174" stroke="#4b5563" stroke-width="1.5"/><text x="124.61139896373057" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">3,500,820</text><text x="323.57512953367876" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">3,500,860</text><text x="522.5388601036269" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">3,500,900</text><text x="721.5025906735751" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">3,500,940</text><text x="920.4663212435233" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">3,500,980</text><circle cx="84.81865284974094" cy="170" r="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="84.81865284974094" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">funding</text><text x="84.81865284974094" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">22:09 UTC</text><circle cx="358.3937823834197" cy="170" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="358.3937823834197" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">escalate</text><text x="358.3937823834197" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">22:39 UTC</text><circle cx="363.36787564766837" cy="170" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="363.36787564766837" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">inputs</text><text x="363.36787564766837" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">22:39 UTC</text><circle cx="766.2694300518135" cy="170" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="766.2694300518135" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">timeout</text><text x="766.2694300518135" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">23:24 UTC</text><circle cx="970.2072538860103" cy="170" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="970.2072538860103" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">sweep</text><text x="970.2072538860103" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">23:46 UTC</text><rect x="84.8" y="80" width="49.7" height="16" rx="3" fill="#2563eb" opacity="0.18"/><text x="109.68911917098447" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">10</text><rect x="363.4" y="80" width="397.9" height="16" rx="3" fill="#c2410c" opacity="0.18"/><text x="562.3316062176166" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">the hub's window: δ + δ′ = 80 blocks, 40 min</text><rect x="766.3" y="80" width="199.0" height="16" rx="3" fill="#c2410c" opacity="0.18"/><text x="865.7512953367875" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">δ = 40: equiv_b's window</text><text x="84.81865284974094" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">to_self_delay</text><text x="50" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Funding to escalation (30 min) was Alice's: the return on the L2, the proof, the trace (~2 min) and her decision to go.</text><text x="50" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Escalation to sweep (67 min) is the protocol's: one block between the links, then two windows the hub had to let pass.</text><text x="50" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">A window counts from the block of the output it guards: the timeout could first be mined in 3,500,948 (it was in 949), the sweep in 989 (990).</text><text x="50" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Since 2026-10-17 the hub's window for a choice like move 2 is 20 blocks on Mutinynet, not 80: the same dispute would take about 30 min.</text></svg>
