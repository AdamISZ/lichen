<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" viewBox="0 0 1060 400"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="399" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">On the L2: the mint, a payment, a split and the claim's record</text><text x="24" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">A note is (owner, value, memo). Alice's spends count once she acknowledges them; the hub's (its mint, its records) at once.</text><rect x="24" y="166" width="112" height="54" rx="6" fill="#fafafa" stroke="#4b5563" stroke-width="1.2"/><text x="80" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">mint</text><text x="80" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub signs</text><rect x="160" y="170" width="150" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/><text x="172" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start">Alice</text><text x="298" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">99,000</text><text x="172" y="207" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">spent</text><line x1="136" y1="193" x2="158" y2="193" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="332" y="166" width="112" height="54" rx="6" fill="#fafafa" stroke="#4b5563" stroke-width="1.2"/><text x="388" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">pay Bob</text><text x="388" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">acknowledged</text><line x1="310" y1="193" x2="330" y2="193" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="470" y="100" width="150" height="46" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="482" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start">Bob</text><text x="608" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">30,000</text><text x="482" y="137" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">no contract behind it</text><rect x="470" y="220" width="150" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/><text x="482" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start">Alice</text><text x="608" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">69,000</text><text x="482" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">spent</text><path d="M 444 183 C 458 183, 456 123, 468 123" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 444 203 C 458 203, 456 243, 468 243" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="642" y="216" width="112" height="54" rx="6" fill="#fafafa" stroke="#4b5563" stroke-width="1.2"/><text x="698" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">split</text><text x="698" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">acknowledged</text><line x1="620" y1="243" x2="640" y2="243" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="780" y="160" width="150" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/><text x="792" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start">Alice</text><text x="918" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">49,984</text><text x="792" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">claimed, retired</text><rect x="780" y="282" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="792" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start">Alice</text><text x="918" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">19,016</text><text x="792" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">no contract behind it</text><path d="M 754 233 C 768 233, 766 183, 778 183" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 754 253 C 768 253, 766 305, 778 305" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="780" y="74" width="250" height="58" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/><text x="905" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">the exit record of 64 units</text><text x="905" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">the hub signs: it retires the note</text><line x1="855" y1="134" x2="855" y2="158" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="24" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Nothing here touches Bitcoin. Dashed: spent. After the fold, the unspent notes are Bob's 30,000 and Alice's 19,016.</text></svg>
