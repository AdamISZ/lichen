<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="380" viewBox="0 0 1060 380"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="379" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">On the L2: three transactions, each sealed by the sequencer within 5 seconds</text><text x="24" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">A note is (owner, value, memo). A transfer spends notes, signed by their owners, into new notes of the same total.</text><rect x="24" y="150" width="120" height="54" rx="6" fill="#fafafa" stroke="#4b5563" stroke-width="1.2"/><text x="84" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">mint</text><text x="84" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub signs</text><rect x="176" y="154" width="150" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/><text x="188" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start">Alice</text><text x="314" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">30,000</text><text x="188" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">memo 0  (spent)</text><line x1="144" y1="177" x2="174" y2="177" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="358" y="150" width="120" height="54" rx="6" fill="#fafafa" stroke="#4b5563" stroke-width="1.2"/><text x="418" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">pay Bob</text><text x="418" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice signs</text><line x1="326" y1="177" x2="356" y2="177" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="510" y="110" width="150" height="46" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="522" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start">Bob</text><text x="648" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">5,000</text><text x="522" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">memo 0</text><rect x="510" y="236" width="150" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/><text x="522" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start">Alice</text><text x="648" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">25,000</text><text x="522" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">memo 0  (spent)</text><path d="M 478 170 C 495 170, 490 133, 508 133" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 478 190 C 495 190, 490 259, 508 259" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="700" y="232" width="120" height="54" rx="6" fill="#fafafa" stroke="#4b5563" stroke-width="1.2"/><text x="760" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">return</text><text x="760" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice signs</text><line x1="660" y1="259" x2="698" y2="259" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="880" y="180" width="150" height="46" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="892" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="start">the hub</text><text x="1018" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">20,000</text><text x="892" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">memo 1000</text><rect x="880" y="282" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="892" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start">Alice</text><text x="1018" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="end">5,000</text><text x="892" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">memo 0</text><path d="M 820 250 C 850 250, 850 203, 878 203" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 820 270 C 850 270, 850 305, 878 305" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="955" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle">the return: the fold checks it</text><text x="955" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">no contract behind it</text><text x="585" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle">no contract behind it</text><text x="24" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Nothing here touches Bitcoin. Dashed: spent. After the fold, the unspent notes are Bob's 5,000, Alice's 5,000 and the hub's 20,000.</text></svg>
