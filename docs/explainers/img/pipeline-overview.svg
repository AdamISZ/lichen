<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="659" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Three statements proved, one checked on Bitcoin: the hub's, that an exit claim is false</text><rect x="24" y="52" width="320" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="184.0" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">a shielded spend</text><text x="184.0" y="93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the sender's device, every shielded</text><text x="184.0" y="109" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">payment; the sequencer checks it</text><rect x="370" y="52" width="320" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="530.0" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the chain, a height at a time</text><text x="530.0" y="93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the sequencer's prover, every sealed</text><text x="530.0" y="109" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">height, each receipt verifying the last</text><rect x="716" y="52" width="320" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="876.0" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the hub's statement</text><text x="876.0" y="93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub, only when an exit claim</text><text x="876.0" y="109" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">is false</text><line x1="346" y1="91" x2="366" y2="91" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="692" y1="91" x2="712" y2="91" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="356" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">the chain guest checks every spend receipt; the hub's proof stands on the chain receipt at the claim's state</text><text x="24" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="start">only if Alice's exit claim is false: on the hub's machine</text><rect x="24" y="194" width="220" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="134.0" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">1. the guest</text><text x="134.0" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the claim, the state at A*, request</text><text x="134.0" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">from Bitcoin: ~1M cycles</text><rect x="288" y="194" width="220" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="398.0" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">2. the STARK</text><text x="398.0" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">about 220 kB, the chain</text><text x="398.0" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">receipt resolved</text><rect x="552" y="194" width="220" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="662.0" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">3. the Groth16 proof</text><text x="662.0" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">three points A, B, C</text><text x="662.0" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">128 bytes</text><rect x="816" y="194" width="220" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="926.0" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">4. assert, on chain</text><text x="926.0" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">A, Lamport-signed in</text><text x="926.0" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">254 digits; B and C beside</text><line x1="246" y1="233.0" x2="284" y2="233.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="266.0" y="225.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">prove</text><line x1="510" y1="233.0" x2="548" y2="233.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="530.0" y="225.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">wrap</text><line x1="774" y1="233.0" x2="812" y2="233.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="794.0" y="225.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">sign A</text><line x1="926.0" y1="274" x2="926.0" y2="322" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="816" y="326" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="926.0" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">Alice's wallet checks it</text><text x="926.0" y="367" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the same Groth16 check,</text><text x="926.0" y="383" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">natively, in about 1.5 ms</text><line x1="926.0" y1="406" x2="926.0" y2="432" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="926.0" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">valid: her claim was false;</text><text x="926.0" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">she concedes, success after Δ₂</text><path d="M 816 365 L 300 365 L 300 504" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="560" y="357" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">false (a lying hub): she challenges</text><text x="24" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">the challenge</text><rect x="24" y="508" width="300" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="174.0" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">5. challenge_assert</text><text x="174.0" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice reveals the secrets of A's</text><text x="174.0" y="565" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">digits, completing the hub's pre-signatures</text><rect x="384" y="508" width="300" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="534.0" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">6. her garbled circuits</text><text x="534.0" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub's kept instances, on A's labels,</text><text x="534.0" y="565" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">give r·A; with B, C: the key, if valid</text><rect x="744" y="508" width="292" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="890.0" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">7. the answer</text><text x="890.0" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">msg unlocked: wrongly_challenged takes</text><text x="890.0" y="565" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the contract; none: failure pays Alice</text><line x1="326" y1="547" x2="380" y2="547" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="686" y1="547" x2="740" y2="547" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="24" y="620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">The garbled circuits were made by Alice when the contract opened, and checked by the hub by cut-and-choose: it kept 10 of 78.</text><text x="24" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">A true claim needs none of this: the hub doesn't assert, and request_timeout pays her.</text></svg>
