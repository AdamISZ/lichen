<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="639" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">A withdrawal claim, from a Rust program to a check on Bitcoin, under BABE</text><rect x="24" y="50" width="1012" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="40" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">The normal case needs no proof from Alice: the hub checks her return natively and signs the fold (cooperative.md).</text><text x="24" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">only if the hub refuses the fold: on chain, Alice requests b and the hub signs the same b; then, on Alice's machine:</text><rect x="24" y="134" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="134.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">1. the guest</text><text x="134.0" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Rust, compiled to RISC-V; checks</text><text x="134.0" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub's signature on b: ~480k cycles</text><rect x="288" y="134" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="398.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">2. the STARK</text><text x="398.0" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">about 220 kB, with the</text><text x="398.0" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">chain receipt resolved</text><rect x="552" y="134" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="662.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">3. the Groth16 proof</text><text x="662.0" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">three points A, B, C</text><text x="662.0" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">128 bytes</text><rect x="816" y="134" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="926.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">4. assert, on chain</text><text x="926.0" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">A, Lamport-signed in</text><text x="926.0" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">254 digits; B and C beside</text><line x1="246" y1="173.0" x2="284" y2="173.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="266.0" y="165.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">prove</text><line x1="510" y1="173.0" x2="548" y2="173.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="530.0" y="165.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">wrap</text><line x1="774" y1="173.0" x2="812" y2="173.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="794.0" y="165.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">sign A</text><line x1="926.0" y1="214" x2="926.0" y2="262" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="816" y="266" width="220" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="926.0" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the hub checks it natively</text><text x="926.0" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the same Groth16 check</text><text x="926.0" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">in about 1.5 ms</text><line x1="926.0" y1="346" x2="926.0" y2="372" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="926.0" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">valid: it lets it stand;</text><text x="926.0" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">success pays Alice after Δ₂</text><path d="M 816 305 L 300 305 L 300 444" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="560" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">false (or a hub that disputes true claims): it challenges</text><text x="24" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">the challenge</text><rect x="24" y="448" width="300" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="174.0" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">5. challenge_assert</text><text x="174.0" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the hub reveals the secrets of A's</text><text x="174.0" y="505" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">digits, as it signed at opening</text><rect x="384" y="448" width="300" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="534.0" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">6. the garbled circuits</text><text x="534.0" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice's kept instances, on A's labels,</text><text x="534.0" y="505" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">give r·A; with B, C: the key, if valid</text><rect x="744" y="448" width="292" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="890.0" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">7. the answer</text><text x="890.0" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">msg unlocked: wrongly_challenged pays</text><text x="890.0" y="505" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Alice; none: failure pays the hub</text><line x1="326" y1="487" x2="380" y2="487" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="686" y1="487" x2="740" y2="487" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="24" y="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">The garbled circuits were made by the hub when the contract opened, and checked by Alice by cut-and-choose: she kept 10 of 78.</text><text x="24" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Under BitVMX, lichen's first gadget, the same Groth16 proof is instead the input of a RISC-V verifier,</text><text x="24" y="598" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">whose 478 million steps are searched on chain down to one instruction (section 5).</text></svg>
