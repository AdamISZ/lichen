<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="576" viewBox="0 0 1060 576"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="575" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">A withdrawal claim, from a Rust program to one instruction checked on Bitcoin</text><rect x="24" y="50" width="1012" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="40" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">The normal case needs no proof from Alice: the hub checks her return natively and signs the fold (cooperative.md).</text><text x="24" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">only if the hub refuses the fold: on Alice's machine, once</text><rect x="24" y="134" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="134.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">1. the guest</text><text x="134.0" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">Rust, compiled to RISC-V</text><text x="134.0" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">about 393k cycles</text><rect x="288" y="134" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="398.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">2. the STARK</text><text x="398.0" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">about 220 kB, with the</text><text x="398.0" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">chain receipt resolved</text><rect x="552" y="134" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="662.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">3. the Groth16 proof</text><text x="662.0" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">RISC Zero + gnark</text><text x="662.0" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">128 bytes</text><rect x="816" y="134" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="926.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">4. the verifier's input</text><text x="926.0" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">204 bytes: 51 words,</text><text x="926.0" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the proof and the journal</text><line x1="246" y1="173.0" x2="284" y2="173.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="266.0" y="165.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">prove</text><line x1="510" y1="173.0" x2="548" y2="173.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="530.0" y="165.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">wrap</text><line x1="774" y1="173.0" x2="812" y2="173.0" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="794.0" y="165.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">encode</text><line x1="926.0" y1="214" x2="926.0" y2="262" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="918.0" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="end">Alice escalates: the input goes on chain, signed word by word</text><rect x="816" y="266" width="220" height="78" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="926.0" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">the hub checks it natively</text><text x="926.0" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">the same Groth16 check</text><text x="926.0" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">in about 1.5 ms</text><line x1="926.0" y1="346" x2="926.0" y2="372" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="926.0" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">true: it concedes; Alice's</text><text x="926.0" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">timeout pays her (hub-returns.md)</text><path d="M 816 305 L 300 305 L 300 444" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="560" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">false: the hub disputes, and the search is played</text><text x="24" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">the dispute</text><rect x="24" y="448" width="300" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="174.0" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">5. BitVMX's Groth16 verifier</text><text x="174.0" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">a fixed RISC-V program, the same for</text><text x="174.0" y="505" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">every withdrawal: about 478M steps</text><rect x="384" y="448" width="300" height="78" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="534.0" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">6. the search, on Bitcoin</text><text x="534.0" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">8-ary over the verifier's run:</text><text x="534.0" y="505" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">10 rounds, 21 moves, one per link</text><rect x="744" y="448" width="292" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="890.0" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">7. one step</text><text x="890.0" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">one RISC-V instruction, checked</text><text x="890.0" y="505" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">in Script: whoever is wrong loses</text><line x1="326" y1="487" x2="380" y2="487" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="686" y1="487" x2="740" y2="487" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="24" y="558" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Two RISC-V programs, two machines: the guest runs only in RISC Zero's zkVM, on Alice's machine; the verifier runs only in BitVMX's emulator.</text></svg>
