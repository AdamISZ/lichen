<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="420" viewBox="0 0 1060 420"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="419" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">What the bytes are: the two big transactions, by virtual size</text><text x="24" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">The scripts verify Winternitz one-time signatures, one 4-bit digit at a time: about 74 bytes of script and 23 of witness per digit.</text><text x="24" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start">escalate</text><rect x="120.0" y="82" width="9.7" height="40" fill="#6b7280" opacity="0.85"/><rect x="129.7" y="82" width="616.3" height="40" fill="#7c3aed" opacity="0.85"/><text x="437.9039357845676" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">leaf script: 470 digits' checks</text><text x="437.9039357845676" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="middle">8,708 vB</text><rect x="746.1" y="82" width="190.3" height="40" fill="#2563eb" opacity="0.85"/><text x="841.2333851199724" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">one-time signatures: 470 digits</text><text x="841.2333851199724" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="middle">2,689 vB</text><rect x="936.4" y="82" width="3.6" height="40" fill="#4b5563" opacity="0.85"/><text x="947.9469186949766" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">11,586 vB</text><text x="24" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start">inputs</text><rect x="120.0" y="152" width="9.7" height="40" fill="#6b7280" opacity="0.85"/><rect x="129.7" y="152" width="527.2" height="40" fill="#7c3aed" opacity="0.85"/><text x="393.31563956499224" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">leaf script: 400 digits' checks</text><text x="393.31563956499224" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="middle">7,448 vB</text><rect x="656.9" y="152" width="162.4" height="40" fill="#2563eb" opacity="0.85"/><text x="738.1141032280337" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">one-time signatures: 400 digits</text><text x="738.1141032280337" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="middle">2,295 vB</text><rect x="819.3" y="152" width="3.6" height="40" fill="#4b5563" opacity="0.85"/><text x="830.8849473502503" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">9,932 vB</text><text x="120" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Grey: the transaction itself (one input, two outputs), 137 vB. Dark: two Schnorr signatures and the control block, 50 vB.</text><text x="24" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">To the same scale</text><text x="24" y="291" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">split</text><rect x="120" y="278" width="10.9" height="18" fill="#2563eb" opacity="0.85"/><text x="138.8993612981184" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">154 vB</text><text x="24" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">timeout</text><rect x="120" y="306" width="41.7" height="18" fill="#2563eb" opacity="0.85"/><text x="169.68651821163473" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">589 vB</text><text x="24" y="347" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">sweep</text><rect x="120" y="334" width="55.9" height="18" fill="#2563eb" opacity="0.85"/><text x="183.91230795788022" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">790 vB</text><text x="24" y="375" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">fold (Test A)</text><rect x="120" y="362" width="13.7" height="18" fill="#15803d" opacity="0.85"/><text x="141.65958915933024" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">193 vB</text><text x="420" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">the five dispute transactions: 23,051 vB</text><text x="420" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">the cooperative fold: 193 vB, about 120× less</text></svg>
