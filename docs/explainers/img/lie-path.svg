oke-width="1.5"/><text x="1000.0" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="end">step 478,324,073: the last</text><text x="1000.0" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="end">agreed step; the lie is at the next</text><text x="147.52276257054825" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="start">step 7: the write to 0xe07ffff0</text><text x="147.52276257054825" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="start">her read names (it wrote 0, not 1)</text><text x="990.0" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="end">13 hops among the last 400 steps,</text><text x="990.0" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="end">then one long jump to 268,435,451</text><text x="601.3317873702374" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">22 long jumps, each about halving the step,</text><text x="601.3317873702374" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">down to step 37</text><text x="219.9698632378053" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">30 short hops,</text><text x="219.9698632378053" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">36 down to 7</text><text x="24" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Each hop goes to the previous step or to the step's long jump; the hub signs every hash along the way. It posts them in 7 chunks of</text><text x="24" y="422" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">about ten (one input each, under Script's 1,000-item stack): path_split makes the carriers, combine_7 spends all seven at once.</text></svg>
