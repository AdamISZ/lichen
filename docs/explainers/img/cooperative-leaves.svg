<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="559" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">The contract output, and how the fold spends it</text><text x="24" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">✓ the leaf the fold used. Grey: the other two, revealed only as one 32-byte hash in the fold's control block.</text><rect x="80" y="90" width="240" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="200" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">contract output</text><text x="200" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">282,891 sats · funding:0 · taproot</text><line x1="160" y1="140" x2="150" y2="200" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="240" y1="140" x2="330" y2="200" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="330" cy="208" r="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="346" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">a branch: 32 bytes in the control block</text><line x1="324" y1="215" x2="305" y2="300" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><line x1="338" y1="213" x2="560" y2="300" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="30" y="202" width="262" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="42" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#111827" text-anchor="start">✓ fold</text><text x="42" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">2-of-2, signed when it happens</text><text x="42" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">b + r_A to Alice, the rest to the hub</text><rect x="195" y="302" width="240" height="70" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/><text x="207" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#4b5563" text-anchor="start">default</text><text x="207" y="343" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">2-of-2 pre-signed, after T_close</text><text x="207" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">r_A to Alice, the rest to the hub</text><rect x="450" y="302" width="240" height="70" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/><text x="462" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#4b5563" text-anchor="start">escalate</text><text x="462" y="343" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">2-of-2 pre-signed, after 10 blocks</text><text x="462" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">Alice's claim: the dispute path</text><text x="30" y="405" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">default: had Alice not withdrawn by T_close (3,520,890, a week after opening), the hub's.</text><text x="30" y="423" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">escalate: had the hub refused the fold, Alice's (see hub-absent.md).</text><text x="700" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start">the fold: 193 vB</text><text x="700" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">one input, two outputs; vB = weight / 4</text><rect x="700" y="130.0" width="70" height="187.5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><line x1="772" y1="223.75" x2="796" y2="219.75" stroke="#d1d5db" stroke-width="1.5"/><text x="800" y="223.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">the transaction: 125 vB</text><text x="800" y="238.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">version, input, 2 outputs, locktime</text><rect x="700" y="317.5" width="70" height="48.8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><line x1="772" y1="341.875" x2="796" y2="337.875" stroke="#d1d5db" stroke-width="1.5"/><text x="800" y="341.875" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">2 signatures: 32.5 vB</text><text x="800" y="356.875" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">64 B each (Schnorr)</text><rect x="700" y="366.2" width="70" height="27.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><line x1="772" y1="379.75" x2="796" y2="375.75" stroke="#d1d5db" stroke-width="1.5"/><text x="800" y="379.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">leaf script: 18 vB</text><text x="800" y="394.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">71 B: 2 keys, CHECKSIG, CHECKSIGADD, 2</text><rect x="700" y="393.2" width="70" height="24.8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><line x1="772" y1="405.625" x2="796" y2="411.75" stroke="#d1d5db" stroke-width="1.5"/><text x="800" y="415.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="start">control block: 16.5 vB</text><text x="800" y="430.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">65 B: the internal key, 1 hash</text><rect x="700" y="418.0" width="70" height="1.1" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="700" y="453.125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">and 0.75 vB of witness framing</text><text x="700" y="483.125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">With MuSig2 (a TODO), the fold would be</text><text x="700" y="501.125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">a key-path spend: one 64-byte signature,</text><text x="700" y="519.125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">142 vB, and look like any taproot payment.</text></svg>
