ily="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">/hp/instance: the 10 kept, 23.9 MiB each</text><text x="325.0" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">65 s on a 30 Mbit/s uplink</text><line x1="184" y1="544" x2="464" y2="544" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="325.0" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">5. /open: the terms, her addresses, the deposit coin,</text><text x="325.0" y="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">her keys, and the other 68 instances opened</text><rect x="345.0" y="570" width="250" height="26" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="470" y="589" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">rebuilds and checks the 68: 20 to 36 s</text><line x1="474" y1="622" x2="944" y2="622" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="710.0" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">mint 99,000 to P = H(A ‖ T)·A + T</text><text x="710.0" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">locked: spending it takes t</text><line x1="466" y1="672" x2="186" y2="672" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="5 3"/><text x="325.0" y="664" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">the offer: T_close, r_H, the windows, the funding, its 7 signatures,</text><text x="325.0" y="688" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">its 1,016 pre-signatures on challenge_assert, T and the mint</text><rect x="45.0" y="706" width="270" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="180" y="725" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">checks the terms, the funding, the hub's</text><text x="180" y="741" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">signatures and pre-signatures; signs the</text><text x="180" y="757" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">17; sees the mint sealed; pre-signs the</text><text x="180" y="773" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">deposit input, locked to T</text><line x1="184" y1="806" x2="464" y2="806" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="325.0" y="798" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">6. /accept: her 17 signatures, her pre-signature</text><rect x="345.0" y="832" width="250" height="42" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="470" y="851" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-si