<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect x="0.5" y="0.5" width="1059" height="699" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Opening contract 1001: four requests, two transactions, then the mint</text><rect x="110" y="56" width="140" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="180" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Alice's wallet</text><line x1="180" y1="88" x2="180" y2="676" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="400" y="56" width="140" height="32" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="470" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">the hub</text><line x1="470" y1="88" x2="470" y2="676" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="690" y="56" width="140" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="760" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Bitcoin</text><line x1="760" y1="88" x2="760" y2="676" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="880" y="56" width="140" height="32" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text x="950" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">the L2</text><line x1="950" y1="88" x2="950" y2="676" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="184" y1="122" x2="464" y2="122" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="325.0" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">1. /info</text><text x="325.0" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">network, deployment, statement, 21 depths: checked</text><line x1="184" y1="174" x2="464" y2="174" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="325.0" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">2. /deposit: Alice's deposit key</text><line x1="466" y1="204" x2="186" y2="204" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="5 3"/><text x="325.0" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">contract 1001, the hub's key, a refund timeout</text><line x1="184" y1="250" x2="754" y2="250" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="470.0" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">3. 71,000 to the deposit address (from any wallet)</text><text x="470.0" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">deposit dc089a53…, block 3,500,811</text><line x1="184" y1="308" x2="464" y2="308" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="325.0" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">4. /open: the terms she asks, her addresses,</text><text x="325.0" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">her one-time keys (51 input words, her moves, 8 hops), the deposit coin</text><line x1="466" y1="366" x2="186" y2="366" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="5 3"/><text x="325.0" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">the offer: T_close, r_H, the hub's keys, the funding,</text><text x="325.0" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">and its 169 signatures on the 141 pre-signed transactions</text><rect x="45.0" y="400" width="270" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="180" y="419" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">checks the terms, the funding's outputs</text><text x="180" y="435" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">and every one of the hub's signatures;</text><text x="180" y="451" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">then signs the 141, and the deposit input</text><line x1="184" y1="484" x2="464" y2="484" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="325.0" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">5. /accept: her 169 signatures, her deposit signature</text><rect x="355.0" y="510" width="230" height="26" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="470" y="529" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">checks them; signs its own input</text><line x1="474" y1="562" x2="754" y2="562" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="615.0" y="554" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">the funding</text><text x="615.0" y="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">418b42cc…, block 3,500,812</text><rect x="370.0" y="614" width="200" height="26" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/><text x="470" y="633" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">sees the funding confirm</text><line x1="474" y1="664" x2="944" y2="664" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="710.0" y="656" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">mint 30,000 tokens to Alice's L2 address</text></svg>
